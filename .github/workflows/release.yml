name: Package CEP release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package-zxp:
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      ZXP_CERT_BASE64: ${{ secrets.ZXP_CERT_BASE64 }}
      ZXP_CERT_PASSWORD: ${{ secrets.ZXP_CERT_PASSWORD }}
      ZXP_TSA_URL: ${{ vars.ZXP_TSA_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: node scripts/release-check.mjs
      - name: Require signing credentials
        run: |
          if [ -z "$ZXP_CERT_BASE64" ] || [ -z "$ZXP_CERT_PASSWORD" ]; then
            echo "Set ZXP_CERT_BASE64 and ZXP_CERT_PASSWORD repository secrets before publishing a release."
            exit 1
          fi
      - name: Install Adobe signing tool
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/Adobe-CEP/CEP-Resources/master/ZXPSignCMD/4.1.3/macOS/ZXPSignCmd \
            --output "$RUNNER_TEMP/ZXPSignCmd"
          chmod +x "$RUNNER_TEMP/ZXPSignCmd"
      - name: Restore signing certificate
        run: node -e "require('fs').writeFileSync(process.env.RUNNER_TEMP + '/aetoolkit-cep.p12', Buffer.from(process.env.ZXP_CERT_BASE64, 'base64'))"
      - name: Package signed ZXP
        env:
          ZXPSIGNCMD_PATH: ${{ runner.temp }}/ZXPSignCmd
          ZXP_CERT_PATH: ${{ runner.temp }}/aetoolkit-cep.p12
        run: npm run package:zxp
      - name: Upload ZXP to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "dist/AE-Toolkit-CEP-$RELEASE_TAG.zxp" --clobber
